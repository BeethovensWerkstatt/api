# Production Docker Compose
#
# Full production stack with nginx reverse proxy.
# The API is accessed directly at root (/) via nginx.
#
# Usage:
#   EXIST_PASSWORD=secure-password docker compose up -d
#
# Access Points:
#   - API:        http://localhost:8080/
#   - API Docs:   http://localhost:8080/api/docs
#   - Health:     http://localhost:8080/api/health

services:
  nginx:
    image: nginx:alpine
    container_name: bw-api-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      existdb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  existdb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bw-api-existdb
    ports:
      - "8080:8080"  # Direct access (optional, for debugging)
    environment:
      - EXIST_ENV=production
      - EXIST_CONTEXT_PATH=/
      - EXIST_DEFAULT_APP_PATH=xmldb:exist:///db/apps/api
      - EXIST_PASSWORD=${EXIST_PASSWORD:?EXIST_PASSWORD is required}
      - BW_ENV=production
    volumes:
      - exist-data:/opt/exist/data
      - exist-backups:/opt/exist/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  exist-data:
    name: bw-api-data
  exist-backups:
    name: bw-api-backups
