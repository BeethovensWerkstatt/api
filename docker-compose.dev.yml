# Development Docker Compose
# 
# Provides a local eXist-db instance with all development tools.
# Use with `npm run watch:docker` for hot-reload development.
#
# Quick Start:
#   1. npm run dist:local           # Build the package
#   2. npm run docker:dev           # Start container  
#   3. npm run watch:docker         # Watch and deploy changes
#
# Access Points:
#   - API:       http://localhost:8080/exist/apps/api/
#   - RESTXQ:    http://localhost:8080/exist/apps/api/api/
#   - Docs:      http://localhost:8080/exist/apps/api/api/docs
#   - eXide:     http://localhost:8080/exist/apps/eXide/
#   - Monex:     http://localhost:8080/exist/apps/monex/
#   - Dashboard: http://localhost:8080/exist/apps/dashboard/

services:
  existdb-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bw-api-dev
    ports:
      - "8080:8080"
      - "8444:8443"
    environment:
      - EXIST_ENV=development
      - EXIST_CONTEXT_PATH=/exist
      - EXIST_PASSWORD=${EXIST_DEV_PASSWORD:-admin123}
      - BW_ENV=development
      - BW_DEBUG=true
      # Required for cglib compatibility with JRE 17 (JDK_JAVA_OPTIONS is ignored by Java 8 launcher)
      - JDK_JAVA_OPTIONS=--add-opens java.base/java.lang=ALL-UNNAMED
    volumes:
      # Mount the package for easy updates (use version from package.json)
      - ./dist:/opt/exist/autodeploy-src:ro
      # Persist eXist-db data between restarts
      - exist-dev-data:/opt/exist/data
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/exist/apps/api/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Copy package on startup
    command: >
      sh -c "
        cp /opt/exist/autodeploy-src/*.xar /opt/exist/autodeploy/ 2>/dev/null || true;
        exec ./entrypoint.sh
      "

volumes:
  exist-dev-data:
    name: bw-api-dev-data
