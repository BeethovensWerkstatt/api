name: CI/CD

on:
  push:
    branches: [ main, develop, dev, dev-*, feature/* ]
  pull_request:
    branches: [ main, develop, dev ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment target'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - staging
          - production

env:
  REGISTRY: docker.io
  IMAGE_NAME: beethovenswerkstatt/api

jobs:
  build-test:
    name: Build and Test Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build package (without data)
        run: npm run dist
      
      - name: Check package was created
        run: |
          if [ ! -f dist/api-*.xar ]; then
            echo "Error: Package file not created"
            exit 1
          fi
          ls -lh dist/api-*.xar
          echo "Package size: $(du -h dist/api-*.xar | cut -f1)"
      
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: dist/api-*.xar
          retention-days: 7

  xqsuite-tests:
    name: XQSuite Unit Tests
    runs-on: ubuntu-latest
    needs: build-test
    
    services:
      existdb:
        image: stadlerpeter/existdb:6.4.0
        env:
          EXIST_ENV: ci
          EXIST_DEFAULT_APP_PATH: auto
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl -f http://localhost:8080/exist/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 90s

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: dist/
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Wait for eXist-db
        run: |
          echo "Waiting for eXist-db to be ready..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080/exist/; then
              echo "eXist-db is ready!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done
      
      - name: Install package to eXist-db
        run: |
          PACKAGE=$(ls dist/api-*.xar | head -1)
          echo "Installing $PACKAGE to eXist-db..."
          curl -X PUT \
            -u admin: \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$PACKAGE" \
            "http://localhost:8080/exist/rest/db/system/repo/$PACKAGE"
        continue-on-error: true
      
      - name: Run XQSuite tests
        run: npm run test
        env:
          EXIST_HOST: localhost
          EXIST_PORT: 8080
          EXIST_USER: admin
          EXIST_PASSWORD: ''
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  docker-build-test:
    name: Docker Build and Integration Test
    runs-on: ubuntu-latest
    needs: build-test
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: bw-api:test
          build-args: |
            GITHUB_REF_NAME=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Check image size
        run: |
          docker images bw-api:test
          SIZE=$(docker images bw-api:test --format "{{.Size}}")
          echo "Docker image size: $SIZE"
      
      - name: Start container
        run: |
          docker run -d --name bw-api-test \
            -p 8080:8080 \
            -e EXIST_PASSWORD=testpass123 \
            -e EXIST_ENV=development \
            -e EXIST_CONTEXT_PATH=/exist \
            bw-api:test
          echo "Container started, waiting for eXist-DB to initialize..."
      
      - name: Wait for eXist-DB startup
        run: |
          echo "Waiting 60 seconds for full startup (eXist + package deployment)..."
          sleep 120
      
      - name: Check container is running
        run: |
          if ! docker ps | grep -q bw-api-test; then
            echo "Error: Container not running"
            docker logs bw-api-test
            exit 1
          fi
          echo "Container is running"
      
      - name: Test eXist-DB is accessible
        run: |
          echo "Testing eXist-DB main page..."
          curl -f http://localhost:8080/exist/ || {
            echo "Error: eXist-DB not accessible"
            docker logs bw-api-test
            exit 1
          }
          echo "✓ eXist-DB is accessible"
      
      - name: Test API app is deployed
        run: |
          echo "Testing API application..."
          curl -f http://localhost:8080/exist/apps/api/ || {
            echo "Error: API app not deployed"
            docker logs bw-api-test
            exit 1
          }
          echo "✓ API app is deployed"
      
      - name: Test Controller-based IIIF endpoints
        run: |
          echo "Testing Controller-based IIIF endpoint..."
          RESPONSE=$(curl -s http://localhost:8080/exist/apps/api/iiif/documents.json)
          
          # Check if we get valid JSON with array structure
          if ! echo "$RESPONSE" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "Error: Invalid response from IIIF endpoint"
            echo "Response: $RESPONSE"
            exit 1
          fi
          
          echo "✓ Controller-based endpoints are working"
          echo "Sample response:"
          echo "$RESPONSE" | jq -r '.[0].id // empty' | head -3
      
      - name: Test OpenAPI spec availability
        run: |
          echo "Testing OpenAPI spec endpoint..."
          SPEC=$(curl -s http://localhost:8080/exist/apps/api/openapi.json)
          
          # Validate it's valid JSON
          if ! echo "$SPEC" | jq empty 2>/dev/null; then
            echo "Error: OpenAPI spec is not valid JSON"
            echo "Response: $SPEC"
            exit 1
          fi
          
          echo "✓ OpenAPI spec is available and valid JSON"
          echo "  Sample keys:"
          echo "$SPEC" | jq -r 'keys | .[0:5]'
      
      - name: Test Swagger UI is accessible
        run: |
          echo "Testing Swagger UI..."
          curl -f http://localhost:8080/exist/apps/api/docs.html || {
            echo "Error: Swagger UI not accessible"
            exit 1
          }
          echo "✓ Swagger UI is accessible"
      
      - name: Check deployment in logs
        if: always()
        run: |
          echo "Checking for deployment messages..."
          docker logs bw-api-test 2>&1 | grep -i "post-install\|deployed" || {
            echo "Warning: No deployment messages found in logs"
            echo "Full logs:"
            docker logs bw-api-test 2>&1 | tail -50
          }
      
      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container Logs ==="
          docker logs bw-api-test
          echo "=== Container Status ==="
          docker ps -a | grep bw-api-test
      
      - name: Stop container
        if: always()
        run: docker rm -f bw-api-test || true

  docker-data-test:
    name: Docker with Data Test
    runs-on: ubuntu-latest
    needs: docker-build-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image with data
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: bw-api:test-data
          build-args: |
            GITHUB_REF_NAME=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Check image size with data
        run: |
          docker images bw-api:test-data
          SIZE=$(docker images bw-api:test-data --format "{{.Size}}")
          echo "Docker image size with data: $SIZE"
      
      - name: Start container with data
        run: |
          docker run -d --name bw-api-data-test \
            -p 8080:8080 \
            -e EXIST_PASSWORD=testpass123 \
            bw-api:test-data
          echo "Container started, waiting for deployment with data..."
          sleep 120  # Data deployment takes longer
      
      - name: Test data is available
        run: |
          echo "Testing if documents are available..."
          RESPONSE=$(curl -s http://localhost:8080/exist/apps/api/iiif/documents.json)
          
          # Response should be a JSON array
          DOC_COUNT=$(echo "$RESPONSE" | jq 'length')
          
          if [ "$DOC_COUNT" -eq 0 ]; then
            echo "Error: No documents found in API"
            echo "Response: $RESPONSE"
            exit 1
          fi
          
          echo "✓ Data is available"
          echo "  Documents found: $DOC_COUNT"
          echo "  Sample document:"
          echo "$RESPONSE" | jq '.[0]'
      
      - name: Stop container
        if: always()
        run: docker rm -f bw-api-data-test || true

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-test, xqsuite-tests, docker-build-test, docker-data-test]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "Build Test: ${{ needs.build-test.result }}"
          echo "XQSuite Tests: ${{ needs.xqsuite-tests.result }}"
          echo "Docker Build Test: ${{ needs.docker-build-test.result }}"
          echo "Docker Data Test: ${{ needs.docker-data-test.result }}"
          
          if [ "${{ needs.build-test.result }}" != "success" ] || \
             [ "${{ needs.docker-build-test.result }}" != "success" ]; then
            echo "❌ Required tests failed"
            exit 1
          fi
          
          echo "✅ All required tests passed"

  # ============================================================
  # Push Docker Image to Registry
  # ============================================================
  docker-push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-test, docker-build-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            GITHUB_REF_NAME=${{ github.ref_name }}

  # ============================================================
  # Deploy (manual trigger only)
  # ============================================================
  deploy:
    name: Deploy to ${{ github.event.inputs.deploy_target }}
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target != 'none'
    
    environment: ${{ github.event.inputs.deploy_target }}
    
    steps:
      - name: Deploy notification
        run: |
          echo "🚀 Deploying to ${{ github.event.inputs.deploy_target }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          
      # Add your deployment steps here based on your infrastructure:
      # Example SSH deployment:
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       cd /path/to/deployment
      #       docker-compose pull
      #       docker-compose up -d

      - name: Deployment placeholder
        run: |
          echo "Deployment commands should be added here based on your infrastructure."
          echo "Common options:"
          echo "  - SSH: ssh user@server 'docker-compose pull && docker-compose up -d'"
          echo "  - Kubernetes: kubectl set image deployment/api api=${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          echo "  - Webhook: curl -X POST https://deploy.example.com/webhook"
