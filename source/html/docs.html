<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Beethovens Werkstatt API Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui.css"/>
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .topbar {
            background-color: #2c3e50;
            padding: 10px 0;
        }
        .topbar-wrapper {
            max-width: 1460px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .topbar-wrapper .link {
            color: #ecf0f1;
            text-decoration: none;
            font-size: 1.5em;
            font-weight: bold;
        }
        .topbar-wrapper .link:hover {
            color: #3498db;
        }
        .info {
            margin: 20px auto;
            max-width: 1460px;
            padding: 0 20px;
        }
        .info h1 {
            color: #2c3e50;
            margin: 0 0 10px 0;
        }
        .info p {
            color: #7f8c8d;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-wrapper">
            <a class="link" href="https://beethovens-werkstatt.de" target="_blank">
                Beethovens Werkstatt
            </a>
        </div>
    </div>
    
    <div class="info">
        <h1>API Documentation</h1>
        <p>
            This API provides access to MEI-encoded music data from the Beethovens Werkstatt project,
            including genetic editions, IIIF manifests, comparative analysis, and sketch studies.
        </p>
    </div>

    <div id="swagger-ui">&#160;</div>

    <script src="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui-bundle.js">&#160;</script>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui-standalone-preset.js">&#160;</script>
    <script>
//<![CDATA[
        window.onload = function() {
            // Determine the OpenAPI spec URL based on current location
            const baseUrl = window.location.origin + window.location.pathname.replace('/docs.html', '');
            const specUrl = baseUrl + '/openapi.json';

            window.ui = SwaggerUIBundle({
                url: specUrl,
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                docExpansion: "list",
                filter: true,
                showRequestHeaders: true,
                tryItOutEnabled: true,
                requestInterceptor: function(request) {
                    // Add CORS headers for try-it-out functionality
                    request.headers['Accept'] = request.headers['Accept'] || 'application/json';
                    return request;
                }
            });
        };
//]]>
    </script>
</body>
</html>
